name: CI

# Gates for every PR and for main (docs/TESTING.md §1, CLAUDE.md "Run the gates locally").
# The two required checks for branch protection are the job names
# "lint · typecheck · unit · round-trip" and "fidelity · offline · ui"; renaming them silently
# un-protects main, so tests/ci/workflows.test.ts pins them.
#
# DEC-053 (M2-58): the work runs as parallel pieces (lint and typecheck, three Vitest shards,
# two fidelity and two UI shards, offline and io) and each required check is the job that
# gathers its pieces. It runs whenever the run was not cancelled and fails unless every piece it
# needs succeeded, so a failed, skipped or missing piece is a red required check (a required
# check that was itself skipped would count as passed, hence `!cancelled()`, never a plain
# `needs`). Nothing is skipped on a PR that ran before: the same suites, the same gates.
#
# DEC-055 (M2-64): three task threads share the account's 20 concurrent jobs, and every merge
# starts a run on main and an update-branch run on each other open PR at once. So a PR run asks for
# at most 8 runners (the fidelity and UI suites share three shards), and a push to main whose tree
# already passed both required checks on its PR (main requires PRs to be up to date, so the
# squash commit's tree is the merge tree the PR's run tested) skips the suites and runs only the
# perf budgets. Every PR run still runs every gate.

on:
  pull_request:
    # ready_for_review re-runs CI so a PR leaving draft gets a fresh green run, which is what
    # auto-merge.yml waits for.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a PR supersedes its old run; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Lint, types, corpus manifest, changelog fragments and the PDF writer's qpdf check: everything
  # in the required unit check that is not `pnpm test`.
  static:
    name: lint · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: ${{ needs.changes.outputs.tested != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm corpus:validate
      - run: pnpm changelog:check
      # The PDF writer's test plot passes qpdf's structural check (M2-16; sheet.test.ts keeps the
      # committed file equal to what the writer writes).
      # From 2026-11-11 the runners could not resolve the Ubuntu archive hosts (every apt mirror
      # in /etc/apt/apt-mirrors.txt failed "Temporary failure resolving"), so when apt cannot
      # install qpdf within its short timeouts, the job takes qpdf's own Linux build from its
      # GitHub release instead. The check below runs on whichever qpdf was installed.
      - name: Install qpdf
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt_opts="-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          if sudo apt-get install -y --no-install-recommends $apt_opts qpdf ||
            { sudo apt-get update $apt_opts && sudo apt-get install -y --no-install-recommends $apt_opts qpdf; }; then
            exit 0
          fi
          dir="$RUNNER_TEMP/qpdf"
          mkdir -p "$dir"
          gh release download --repo qpdf/qpdf --pattern '*-bin-linux-x86_64.zip' --dir "$dir"
          unzip -q "$dir"/*.zip -d "$dir"
          bin="$(dirname "$(find "$dir" -type f -name qpdf -path '*/bin/*' | head -n 1)")"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/qpdf" --version
      - run: qpdf --check packages/testkit/fixtures/pdf/plot-sheet.pdf

  # `pnpm test` in three pieces of about equal length (tests/ci/shard.ts splits by the durations
  # in tests/ci/vitest-timings.json). Each piece keeps its Vitest blob (results and coverage) and
  # the DXF saves it wrote for the ezdxf audit; the required check below merges them.
  unit:
    name: unit · shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: ${{ needs.changes.outputs.tested != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The corpus suites also write every AC1032 DXF save, unedited and edited, for the ezdxf
      # audit (M1-105, DEC-047 item 7).
      - run: pnpm test:shard --shard=${{ matrix.shard }}/3 --outputFile.blob=test-reports/vitest-blobs/blob-${{ matrix.shard }}.json
        env:
          TRIYA_DXF_AUDIT_DIR: test-reports/dxf-audit
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unit-shard-${{ matrix.shard }}
          path: |
            test-reports/vitest-blobs/
            test-reports/dxf-audit/
          if-no-files-found: error
          retention-days: 3

  checks:
    name: lint · typecheck · unit · round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, static, unit]
    if: ${{ !cancelled() && needs.changes.outputs.tested != 'true' }}
    steps:
      - name: Every piece passed
        run: |
          echo "changes: ${{ needs.changes.result }}; lint · typecheck: ${{ needs.static.result }}; unit shards: ${{ needs.unit.result }}"
          test "${{ needs.changes.result }}" = success
          test "${{ needs.static.result }}" = success
          test "${{ needs.unit.result }}" = success
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: unit-shard-*
          merge-multiple: true
          path: test-reports
      # One blob per shard, or the merged run would silently cover less than the whole suite.
      - name: Every shard's results arrived
        run: test "$(find test-reports/vitest-blobs -name 'blob-*.json' | wc -l)" -eq 3
      # The whole suite's results and coverage in one report: fails on any failed test and
      # applies the coverage gates (vitest.config.ts) to the merged coverage.
      - run: pnpm test:merge
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: vitest-results
          path: test-reports/vitest/results.json
          retention-days: 14
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m pip install -r scripts/dxf-audit/requirements.txt
      - run: python -m unittest discover -s scripts/dxf-audit
      - run: python scripts/dxf-audit/audit.py test-reports/dxf-audit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dxf-audit
          path: test-reports/dxf-audit
          retention-days: 14

  # Decides whether the perf budgets must run on this PR (TESTING.md §1: PRs touching
  # render/engine/io). On a PR, HEAD is the merge commit, so HEAD^1..HEAD is exactly the PR's diff.
  # Also names the tree under test and, on a push to main, whether a PR run of this repository
  # already passed both required checks on that same tree (the `passed` job below records it).
  changes:
    name: detect hot-path changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      hot: ${{ steps.diff.outputs.hot }}
      tree: ${{ steps.tree.outputs.tree }}
      tested: ${{ steps.tree.outputs.tested }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      # A lookup that fails counts as not passed, so the run tests everything.
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          tested=false
          if [ "$EVENT" = push ]; then
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ci-passed-$tree&per_page=100" \
              --jq '.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == .workflow_run.repository_id) | .workflow_run.id' \
              || true)"
            if [ -n "$runs" ]; then
              tested=true
              for run in $runs; do
                echo "::notice::Tree $tree passed every gate in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run; only the perf budgets run."
              done
            fi
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "hot=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(packages/render/|packages/engine/|packages/io/)'; then
            echo "hot=true" >> "$GITHUB_OUTPUT"
          else
            echo "hot=false" >> "$GITHUB_OUTPUT"
          fi

  # The fidelity and UI suites in three Playwright shards (each job runs its piece of both, so
  # their uneven files even out) plus the production-build suites; the required check
  # "fidelity · offline · ui" below gathers them. They do not wait for the unit check.
  playwright:
    name: fidelity · ui · shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: ${{ needs.changes.outputs.tested != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      # Chromium's system libraries come from apt. When the Ubuntu archive does not resolve (as
      # from 2026-11-11, when only Playwright's extra fonts were missing from the image), the
      # browser still runs if no library it links is missing; a missing one fails the job.
      - name: Install browser system dependencies
        run: |
          if pnpm exec playwright install-deps chromium; then exit 0; fi
          echo "::warning::playwright install-deps failed; checking Chromium's libraries instead"
          missing="$(find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell \) \
            -exec ldd {} \; | grep 'not found' || true)"
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
      - run: pnpm test:fidelity --shard=${{ matrix.shard }}/3
      # Kept before the UI suite runs: every Playwright run empties test-results/.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fidelity-diffs-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
            test-reports/fidelity/
          retention-days: 14
      - if: ${{ !cancelled() }}
        run: pnpm test:ui --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-results-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
            test-reports/fidelity/
          retention-days: 14

  # The offline suite serves the production build (M2-19), so the build runs here.
  offline:
    name: build · offline · io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: ${{ needs.changes.outputs.tested != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      # Chromium's system libraries come from apt. When the Ubuntu archive does not resolve (as
      # from 2026-11-11, when only Playwright's extra fonts were missing from the image), the
      # browser still runs if no library it links is missing; a missing one fails the job.
      - name: Install browser system dependencies
        run: |
          if pnpm exec playwright install-deps chromium; then exit 0; fi
          echo "::warning::playwright install-deps failed; checking Chromium's libraries instead"
          missing="$(find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell \) \
            -exec ldd {} \; | grep 'not found' || true)"
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
      - run: pnpm build
      - run: pnpm test:offline
      # The io suite still runs after an offline failure so one red PR shows every broken gate.
      - if: ${{ !cancelled() }}
        run: pnpm test:io
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: offline-io-results
          path: |
            test-results/
            playwright-report/
            test-reports/fidelity/
          retention-days: 14

  browser:
    name: fidelity · offline · ui
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, playwright, offline]
    if: ${{ !cancelled() && needs.changes.outputs.tested != 'true' }}
    steps:
      - name: Every piece passed
        run: |
          echo "changes: ${{ needs.changes.result }}; fidelity · ui shards: ${{ needs.playwright.result }}; build · offline · io: ${{ needs.offline.result }}"
          test "${{ needs.changes.result }}" = success
          test "${{ needs.playwright.result }}" = success
          test "${{ needs.offline.result }}" = success

  # Records that this PR run's merge tree passed both required checks, so the push to main that
  # lands the same tree need not run the suites again (DEC-055). Runs only when every job it needs
  # succeeded.
  passed:
    name: record the tree that passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, checks, browser]
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - run: echo "$GITHUB_SHA passed in run $GITHUB_RUN_ID" > ci-passed.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ci-passed-${{ needs.changes.outputs.tree }}
          path: ci-passed.txt
          retention-days: 7

  perf:
    name: performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    # Always on main; on PRs that touch render/engine/io, or when asked via the `perf` label
    # or a "[perf]" title.
    if: >-
      github.ref == 'refs/heads/main'
      || needs.changes.outputs.hot == 'true'
      || contains(github.event.pull_request.labels.*.name, 'perf')
      || contains(github.event.pull_request.title, '[perf]')
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      # Chromium's system libraries come from apt. When the Ubuntu archive does not resolve (as
      # from 2026-11-11, when only Playwright's extra fonts were missing from the image), the
      # browser still runs if no library it links is missing; a missing one fails the job.
      - name: Install browser system dependencies
        run: |
          if pnpm exec playwright install-deps chromium; then exit 0; fi
          echo "::warning::playwright install-deps failed; checking Chromium's libraries instead"
          missing="$(find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell \) \
            -exec ldd {} \; | grep 'not found' || true)"
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
      - run: pnpm build
      - run: pnpm test:perf
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: perf-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
