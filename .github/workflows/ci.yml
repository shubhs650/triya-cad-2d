name: CI

# Gates for every PR and for main (docs/TESTING.md §1, CLAUDE.md "Run the gates locally").
# The two required checks for branch protection are the job names
# "lint · typecheck · unit · round-trip" and "fidelity · offline · ui"; renaming them silently
# un-protects main, so tests/ci/workflows.test.ts pins them.
#
# DEC-053 (M2-58): the work runs as parallel pieces (lint and typecheck, three Vitest shards,
# two fidelity and two UI shards, offline and io) and each required check is the job that
# gathers its pieces. It runs whenever the run was not cancelled and fails unless every piece it
# needs succeeded, so a failed, skipped or missing piece is a red required check (a required
# check that was itself skipped would count as passed, hence `!cancelled()`, never a plain
# `needs`). Nothing is skipped on a PR that ran before: the same suites, the same gates.
#
# DEC-055 (M2-64): three task threads share the account's 20 concurrent jobs, and every merge
# starts a run on main and an update-branch run on each other open PR at once. So a PR run asks for
# at most 8 runners (the fidelity and UI suites share three shards), and a push to main whose tree
# already passed both required checks on its PR (main requires PRs to be up to date, so the
# squash commit's tree is the merge tree the PR's run tested) skips the suites and runs only the
# perf budgets. Every PR run still runs every gate.
#
# DEC-075: two task threads, at most 8 runners each (16 of the 20), and the shortest wall-clock
# time per PR. Four unit shards and three fidelity · UI shards start together with
# `lint · typecheck`; `build · offline · io` and then `performance budgets` follow it on the same
# runner slot, so a run never holds more than 8 runners. Unit and UI shards split by duration:
# the committed timings overlaid with those of the last green PR runs, which
# `detect hot-path changes` picks once for the whole run so every shard computes the same split;
# the unit check also fails unless every Vitest file has a result. The ezdxf audit runs on all of
# the gathering job's CPUs.

on:
  pull_request:
    # ready_for_review re-runs CI so a PR leaving draft gets a fresh green run, which is what
    # auto-merge.yml waits for.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a PR supersedes its old run; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Lint, types, corpus manifest, changelog fragments and the PDF writer's qpdf check: everything
  # in the required unit check that is not `pnpm test`.
  static:
    name: lint · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: ${{ needs.changes.outputs.tested != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm corpus:validate
      - run: pnpm changelog:check
      # PlaneGCS (M9-01): the committed solver module must be what its inputs build
      # (third_party/planegcs/build.sh, Emscripten in its pinned Docker image). The build runs
      # only for a pair of input and output hashes not verified before: a job that rebuilt and
      # matched saves the key, with Eigen's download, so later runs skip the 1-2 minute build.
      - id: planegcs
        run: |
          outputs="$(cat packages/constraints/wasm/planegcs.mjs packages/constraints/wasm/planegcs.wasm | sha256sum | cut -c1-16)"
          echo "key=$(node scripts/planegcs-stamp.mjs --key)-$outputs" >> "$GITHUB_OUTPUT"
      - id: planegcs-cache
        uses: actions/cache@v4
        with:
          path: third_party/planegcs/.cache
          key: planegcs-verified-${{ steps.planegcs.outputs.key }}
          restore-keys: planegcs-verified-
      - name: Rebuild PlaneGCS and compare with the committed module
        if: steps.planegcs-cache.outputs.cache-hit != 'true'
        run: pnpm planegcs:build && git diff --exit-code packages/constraints/wasm
      # The PDF writer's test plot passes qpdf's structural check (M2-16; sheet.test.ts keeps the
      # committed file equal to what the writer writes).
      # From 2026-11-11 the runners could not resolve the Ubuntu archive hosts (every apt mirror
      # in /etc/apt/apt-mirrors.txt failed "Temporary failure resolving"), so when apt cannot
      # install qpdf within its short timeouts, the job takes qpdf's own Linux build from its
      # GitHub release instead. The check below runs on whichever qpdf was installed.
      - name: Install qpdf
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt_opts="-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          if sudo apt-get install -y --no-install-recommends $apt_opts qpdf ||
            { sudo apt-get update $apt_opts && sudo apt-get install -y --no-install-recommends $apt_opts qpdf; }; then
            exit 0
          fi
          dir="$RUNNER_TEMP/qpdf"
          mkdir -p "$dir"
          gh release download --repo qpdf/qpdf --pattern '*-bin-linux-x86_64.zip' --dir "$dir"
          unzip -q "$dir"/*.zip -d "$dir"
          bin="$(dirname "$(find "$dir" -type f -name qpdf -path '*/bin/*' | head -n 1)")"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/qpdf" --version
      - run: qpdf --check packages/testkit/fixtures/pdf/plot-sheet.pdf

  # `pnpm test` in four pieces of about equal length (tests/ci/shard.ts splits by the durations
  # in tests/ci/vitest-timings.json, overlaid with the recent green runs' ones, DEC-075). Each
  # piece keeps its Vitest blob (results and coverage) and the DXF saves it wrote for the ezdxf
  # audit; the required check below merges them.
  unit:
    name: unit · shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: ${{ needs.changes.outputs.tested != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Timings of the last green runs
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS: ${{ needs.changes.outputs.timings }}
        run: bash scripts/ci-timings-fetch.sh
      # The corpus suites also write every AC1032 DXF save, unedited and edited, for the ezdxf
      # audit (M1-105, DEC-047 item 7).
      - run: pnpm test:shard --shard=${{ matrix.shard }}/4 --outputFile.blob=test-reports/vitest-blobs/blob-${{ matrix.shard }}.json
        env:
          TRIYA_DXF_AUDIT_DIR: test-reports/dxf-audit
          TRIYA_VITEST_TIMINGS: test-reports/ci-timings/vitest.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unit-shard-${{ matrix.shard }}
          path: |
            test-reports/vitest-blobs/
            test-reports/dxf-audit/
          if-no-files-found: error
          retention-days: 3

  checks:
    name: lint · typecheck · unit · round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, static, unit]
    if: ${{ !cancelled() && needs.changes.outputs.tested != 'true' }}
    steps:
      - name: Every piece passed
        run: |
          echo "changes: ${{ needs.changes.result }}; lint · typecheck: ${{ needs.static.result }}; unit shards: ${{ needs.unit.result }}"
          test "${{ needs.changes.result }}" = success
          test "${{ needs.static.result }}" = success
          test "${{ needs.unit.result }}" = success
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: unit-shard-*
          merge-multiple: true
          path: test-reports
      # One blob per shard, or the merged run would silently cover less than the whole suite.
      - name: Every shard's results arrived
        run: test "$(find test-reports/vitest-blobs -name 'blob-*.json' | wc -l)" -eq 4
      # The whole suite's results and coverage in one report: fails on any failed test and
      # applies the coverage gates (vitest.config.ts) to the merged coverage.
      - run: pnpm test:merge
      # And it has a result for every test file the suite includes, whatever the shards did.
      - name: Every test file ran
        run: |
          pnpm exec vitest list --filesOnly --json=test-reports/vitest/files.json
          node --experimental-strip-types scripts/vitest-every-file.ts test-reports/vitest/files.json test-reports/vitest/results.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: vitest-results
          path: test-reports/vitest/results.json
          retention-days: 14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/dxf-audit/requirements.txt
      - run: python -m pip install -r scripts/dxf-audit/requirements.txt
      - run: python -m unittest discover -s scripts/dxf-audit
      - run: python scripts/dxf-audit/audit.py test-reports/dxf-audit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dxf-audit
          path: test-reports/dxf-audit
          retention-days: 14

  # Decides whether the perf budgets must run on this PR (TESTING.md §1: PRs touching
  # render/engine/io, and the constraint solver since M9-01). On a PR, HEAD is the merge commit,
  # so HEAD^1..HEAD is exactly the PR's diff.
  # Also names the tree under test and, on a push to main, whether a PR run of this repository
  # already passed both required checks on that same tree (the `passed` job below records it).
  changes:
    name: detect hot-path changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      hot: ${{ steps.diff.outputs.hot }}
      tree: ${{ steps.tree.outputs.tree }}
      tested: ${{ steps.tree.outputs.tested }}
      timings: ${{ steps.timings.outputs.artifacts }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      # A lookup that fails counts as not passed, so the run tests everything.
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          tested=false
          if [ "$EVENT" = push ]; then
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ci-passed-$tree&per_page=100" \
              --jq '.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == .workflow_run.repository_id) | .workflow_run.id' \
              || true)"
            if [ -n "$runs" ]; then
              tested=true
              for run in $runs; do
                echo "::notice::Tree $tree passed every gate in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run; only the perf budgets run."
              done
            fi
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      # DEC-075: the shard-timing artifacts of this repository's last three green PR runs
      # ("<run>/<artifact id>/<name>"), picked once here so every shard of this run splits by the
      # same durations. A failed lookup leaves the list empty, and every shard then splits by the
      # committed timings alone.
      - id: timings
        if: ${{ steps.tree.outputs.tested != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifacts=""
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&status=success&per_page=10" \
            --jq '.workflow_runs[] | select(.head_repository.id == .repository.id) | .id' || true)"
          for run in $(echo "$runs" | head -n 3); do
            found="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false and (.name == "vitest-results" or (.name | startswith("ui-timings-")))) | "\(.id)/\(.name)"' \
              || true)"
            for a in $found; do artifacts="$artifacts $run/$a"; done
          done
          echo "artifacts=${artifacts# }" >> "$GITHUB_OUTPUT"
          echo "Shard timings from: ${artifacts:-the committed timings only}"
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "hot=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(packages/render/|packages/engine/|packages/io/|packages/constraints/|third_party/planegcs/)'; then
            echo "hot=true" >> "$GITHUB_OUTPUT"
          else
            echo "hot=false" >> "$GITHUB_OUTPUT"
          fi

  # The fidelity and UI suites in three Playwright shards (each job runs its piece of both) plus
  # the production-build suites; the required check "fidelity · offline · ui" below gathers them.
  # They do not wait for the unit check. Fidelity tests split by count (each test is its own
  # group); UI spec files split by duration (tests/ci/ui-shard.ts, DEC-075), and each shard keeps
  # its files' durations as `ui-timings-<i>` for later runs.
  playwright:
    name: fidelity · ui · shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: ${{ needs.changes.outputs.tested != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: pw
        run: |
          echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      # Chromium's system packages (Playwright's extra fonts), from the cache of their .deb files
      # when it has them, else from apt with retries; when the Ubuntu archive does not resolve (as
      # from 2026-11-11), the browser still runs if no library it links is missing, and a missing
      # one fails the job (scripts/ci-browser-deps.sh).
      - id: apt-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pw-apt
          key: pw-apt-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}
          # Another build of the same runner image (ImageVersion 20261116.133.1 and .376.1 ran side by
          # side on 2026-11-24) restores the latest packages saved for its OS: dpkg installs them, or
          # the script falls back to apt. Without this a new build missed the cache, and apt from a
          # slow mirror ran the job into its time limit (runs 45307386010, 45311774597).
          restore-keys: pw-apt-${{ steps.pw.outputs.os }}-
      - name: Install browser system dependencies
        run: bash scripts/ci-browser-deps.sh
      - run: pnpm test:fidelity --shard=${{ matrix.shard }}/3
      # Kept before the UI suite runs: every Playwright run empties test-results/.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fidelity-diffs-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
            test-reports/fidelity/
          retention-days: 14
      - name: Timings of the last green runs
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS: ${{ needs.changes.outputs.timings }}
        run: bash scripts/ci-timings-fetch.sh
      - if: ${{ !cancelled() }}
        env:
          TRIYA_UI_TIMINGS: test-reports/ci-timings/ui.json
          TRIYA_PW_TIMINGS: test-reports/ui-timings/ui-${{ matrix.shard }}.json
        run: |
          files="$(node --experimental-strip-types tests/ci/ui-shard.ts ${{ matrix.shard }}/3)"
          pnpm test:ui $files
          node --experimental-strip-types tests/ci/ui-shard.ts --ran ${{ matrix.shard }}/3 "$TRIYA_PW_TIMINGS"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ui-timings-${{ matrix.shard }}
          path: test-reports/ui-timings/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-results-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
            test-reports/fidelity/
          retention-days: 14

  # The offline suite serves the production build (M2-19), so the build runs here. It starts once
  # `lint · typecheck` has finished, on the runner that job frees (DEC-075: 8 runners a run), and
  # runs whatever that job's result, so one red run still shows every broken gate.
  offline:
    name: build · offline · io
    # Ubuntu 24.04, not ubuntu-latest (26.04 since 2026-11): Playwright 1.64's WebKit build is made
    # for 24.04, and on 26.04 its page crashed in the third test of every browser (M7-09, runs
    # 44989492589, 44990093698, 44990858929); on 24.04 the same tests pass.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes, static]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.tested != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: pw
        run: |
          echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      # Chromium's system packages (Playwright's extra fonts), from the cache of their .deb files
      # when it has them, else from apt with retries; when the Ubuntu archive does not resolve (as
      # from 2026-11-11), the browser still runs if no library it links is missing, and a missing
      # one fails the job (scripts/ci-browser-deps.sh).
      - id: apt-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pw-apt
          key: pw-apt-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}
          # Another build of the same runner image (ImageVersion 20261116.133.1 and .376.1 ran side by
          # side on 2026-11-24) restores the latest packages saved for its OS: dpkg installs them, or
          # the script falls back to apt. Without this a new build missed the cache, and apt from a
          # slow mirror ran the job into its time limit (runs 45307386010, 45311774597).
          restore-keys: pw-apt-${{ steps.pw.outputs.os }}-
      - name: Install browser system dependencies
        run: bash scripts/ci-browser-deps.sh
      - run: pnpm build
      - run: pnpm test:offline
      # The io suite still runs after an offline failure so one red PR shows every broken gate.
      - if: ${{ !cancelled() }}
        run: pnpm test:io
      # M7-09 (PRD §8, DEC-023): Firefox and Safari's degraded mode on Playwright's Firefox and
      # WebKit, against the build above. Their browsers and their system packages' .deb files are
      # cached apart from Chromium's (WebKit's GStreamer and the rest are not on the runner image).
      - id: pw-other
        if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright/firefox-*
            ~/.cache/ms-playwright/webkit-*
            ~/.cache/ms-playwright/ffmpeg-*
          key: playwright-firefox-webkit-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: ${{ !cancelled() && steps.pw-other.outputs.cache-hit != 'true' }}
        run: pnpm exec playwright install firefox webkit
      - if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/pw-apt-firefox-webkit
          key: pw-apt-firefox-webkit-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}
          restore-keys: pw-apt-firefox-webkit-${{ steps.pw.outputs.os }}-
      - name: Install Firefox and WebKit system dependencies
        if: ${{ !cancelled() }}
        run: bash scripts/ci-browser-deps.sh firefox webkit
      - if: ${{ !cancelled() }}
        run: pnpm test:browsers
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: offline-io-results
          path: |
            test-results/
            playwright-report/
            test-reports/fidelity/
          retention-days: 14

  browser:
    name: fidelity · offline · ui
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, playwright, offline]
    if: ${{ !cancelled() && needs.changes.outputs.tested != 'true' }}
    steps:
      - name: Every piece passed
        run: |
          echo "changes: ${{ needs.changes.result }}; fidelity · ui shards: ${{ needs.playwright.result }}; build · offline · io: ${{ needs.offline.result }}"
          test "${{ needs.changes.result }}" = success
          test "${{ needs.playwright.result }}" = success
          test "${{ needs.offline.result }}" = success

  # Records that this PR run's merge tree passed both required checks, so the push to main that
  # lands the same tree need not run the suites again (DEC-055). Runs only when every job it needs
  # succeeded.
  passed:
    name: record the tree that passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, checks, browser]
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - run: echo "$GITHUB_SHA passed in run $GITHUB_RUN_ID" > ci-passed.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ci-passed-${{ needs.changes.outputs.tree }}
          path: ci-passed.txt
          retention-days: 7

  perf:
    name: performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # After `build · offline · io`, on the runner it frees (DEC-075), whatever its result; on a
    # main push whose tree already passed, that job is skipped and perf runs straight away.
    needs: [changes, offline]
    # Always on main; on PRs that touch render/engine/io or the solver, or when asked via the
    # `perf` label or a "[perf]" title.
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' && (
      github.ref == 'refs/heads/main'
      || needs.changes.outputs.hot == 'true'
      || contains(github.event.pull_request.labels.*.name, 'perf')
      || contains(github.event.pull_request.title, '[perf]')) }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: pw
        run: |
          echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      # Chromium's system packages (Playwright's extra fonts), from the cache of their .deb files
      # when it has them, else from apt with retries; when the Ubuntu archive does not resolve (as
      # from 2026-11-11), the browser still runs if no library it links is missing, and a missing
      # one fails the job (scripts/ci-browser-deps.sh).
      - id: apt-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pw-apt
          key: pw-apt-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}
          # Another build of the same runner image (ImageVersion 20261116.133.1 and .376.1 ran side by
          # side on 2026-11-24) restores the latest packages saved for its OS: dpkg installs them, or
          # the script falls back to apt. Without this a new build missed the cache, and apt from a
          # slow mirror ran the job into its time limit (runs 45307386010, 45311774597).
          restore-keys: pw-apt-${{ steps.pw.outputs.os }}-
      - name: Install browser system dependencies
        run: bash scripts/ci-browser-deps.sh
      - run: pnpm build
      - run: pnpm test:perf
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: perf-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
