name: Auto-merge after green CI

# CI is the reviewer (DEC-031). This workflow enables squash auto-merge on a PR only after a
# CI run for the PR's *current* head commit has finished green, so a failing check (for
# example a deliberately failing fidelity test) can never be merged, even before branch
# protection lists the required checks. With required checks configured it is belt and braces.
#
# Runs from the default branch's copy of this file (workflow_run), never checks out PR code.
# Uses AUTOMERGE_TOKEN (fine-grained PAT: Pull requests + Contents read/write) when present so
# the squash commit on main triggers CI; falls back to GITHUB_TOKEN.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    name: enable auto-merge after green CI
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge on the PR whose head just passed CI
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr=$(gh pr list --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then echo "No open PR for $HEAD_BRANCH."; exit 0; fi
          read -r sha draft < <(gh pr view "$pr" --json headRefOid,isDraft --jq '"\(.headRefOid) \(.isDraft)"')
          if [ "$sha" != "$HEAD_SHA" ]; then
            echo "PR #$pr has moved past $HEAD_SHA; the run for its new head decides."; exit 0
          fi
          if [ "$draft" = "true" ]; then
            echo "PR #$pr is a draft; marking it ready re-runs CI, which re-triggers this."; exit 0
          fi
          gh pr merge "$pr" --auto --squash \
            || echo "Auto-merge not enabled (check the repo's Allow auto-merge setting and token)."
